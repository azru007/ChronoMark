<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Background subtle grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="130" fill="url(#glow)" />
  
  <!-- Outer glowing active timeline arc -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="500 200" transform="rotate(-45 256 256)" filter="url(#shadow)" />
  
  <!-- Center Core Button representation -->
  <circle cx="256" cy="256" r="76" fill="#0f172a" stroke="#334155" stroke-width="6" />
  <circle cx="256" cy="256" r="54" fill="url(#ringGrad)" />
  
  <!-- Clock hands / marker line -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="256" x2="320" y2="256" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  
  <!-- Pin node marker -->
  <circle cx="256" cy="116" r="16" fill="#fbbf24" stroke="#ffffff" stroke-width="4" />
</svg>
